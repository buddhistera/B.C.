# =====================================================================
#  Buddhist Era — offline Windows app (Tauri) build
#  අවශ්‍ය විට පමණක්:  GitHub → Actions → "Windows build" → Run workflow → Run workflow
#  • version හිස්ව තැබුවොත් ස්වයංක්‍රීයව අවසාන අගයට 1ක් එක් කරයි (app-version.json; උදා: 1.0.0 → 1.0.1)
#  • notes: "අලුත් දේ" — ඇප් එකේ යාවත්කාලීන දැනුම්දීමේ පෙන්වයි (නව පේළියකට \n)
#  ප්‍රතිඵලය: එම run එකේ "Artifacts" සහ GitHub Releases (windows-vX.Y.Z):
#    • Buddhist-Era-Setup.exe  — install කිරීමේදී "මට පමණක්" හෝ "සියලු පරිශීලකයින්ට" තෝරාගත හැක
#    • Buddhist-Era.msi        — සියලු පරිශීලකයින්ට (Administrator / IT deployment)
#  release එකෙන් පසු app-version.json යාවත්කාලීන වේ → පරණ Windows ඇප් විවෘත කරන විට යාවත්කාලීන දැනුම්දීම පෙනේ.
# =====================================================================
name: Windows build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version — හිස්ව තබන්න (ස්වයංක්‍රීයව අවසාන අගය + 1; උපරිම 255.255.65535)'
        required: false
        default: ''
      notes:
        description: 'අලුත් දේ (යාවත්කාලීන දැනුම්දීමේ පෙන්වයි; නව පේළියකට \n). හිස්ව තැබිය හැක'
        required: false
        default: ''
  push:
    branches: [desktop-app]   # සංවර්ධනය සඳහා පමණි

permissions:
  contents: write   # build log එක ci-logs-desktop branch එකට, release සහ app-version.json

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # repo නම "B.C." අගින් තිතක් ඇති නිසා Windows හි සාමාන්‍ය checkout එක අසාර්ථක වේ → C:\bc වෙත clone කරයි
      - id: co
        working-directory: C:\
        run: |
          git init -q /c/bc && cd /c/bc
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD
          git log --oneline -1

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: rust
        uses: dtolnay/rust-toolchain@stable

      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: C:/bc/desktop-app/src-tauri

      - id: npm
        name: Install Tauri CLI
        working-directory: C:/bc/desktop-app
        run: npm install --no-audit --no-fund 2>&1 | tee -a ../build.log

      # අනුවාදය: අතින් දුන්නේ නැත්නම් app-version.json හි අවසාන අගය + 1
      - id: ver
        name: Version
        working-directory: C:/bc
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$IN_VERSION" ]; then echo "APP_VERSION=$IN_VERSION" >> "$GITHUB_ENV"; echo "APP_VERSION=$IN_VERSION";
          else node .github/scripts/app-version.mjs next windows app-version.json; fi

      - id: www
        name: Copy web files into the app + set version
        working-directory: C:/bc/desktop-app
        run: |
          npm run prepare-www 2>&1 | tee -a ../build.log
          npm run set-version 2>&1 | tee -a ../build.log

      - id: tauri
        name: Build installer (.exe + .msi)
        working-directory: C:/bc/desktop-app
        run: npx tauri build 2>&1 | tee -a ../build.log

      - id: art
        uses: actions/upload-artifact@v4
        with:
          name: buddhist-era-windows-v${{ env.APP_VERSION }}
          path: |
            C:/bc/desktop-app/src-tauri/target/release/bundle/nsis/*.exe
            C:/bc/desktop-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # GitHub Releases: installer ගොනු (සෘජු බාගත කිරීම)
      - name: Prepare release files
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /c/rel
          cp /c/bc/desktop-app/src-tauri/target/release/bundle/nsis/*.exe "/c/rel/Buddhist-Era-Setup.exe"
          cp /c/bc/desktop-app/src-tauri/target/release/bundle/msi/*.msi "/c/rel/Buddhist-Era.msi"

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Windows ${{ env.APP_VERSION }}
          body: |
            Buddhist Era (බුද්ධ වර්ෂය) — Windows ${{ env.APP_VERSION }} (offline)
            • Buddhist-Era-Setup.exe — install කිරීමේදී "මට පමණක්" (Administrator අවශ්‍ය නැත) හෝ "සියලු පරිශීලකයින්ට" තෝරන්න.
            • Buddhist-Era.msi — Administrator ලවා සියලු පරිශීලකයින්ට.
            "Windows protected your PC" පෙන්වුවහොත්: More info → Run anyway.

            ${{ inputs.notes }}
          files: |
            C:/rel/Buddhist-Era-Setup.exe
            C:/rel/Buddhist-Era.msi
          make_latest: true
          overwrite_files: true

      # ඇප් එකේ යාවත්කාලීන දැනුම්දීම: main හි app-version.json යාවත්කාලීන කරයි (පරණ ඇප් වලට අලුත් අනුවාදය පෙනේ)
      - name: Update app-version.json
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ env.APP_VERSION }}
          NOTES: ${{ inputs.notes }}
          URL: https://github.com/${{ github.repository }}/releases/download/windows-v${{ env.APP_VERSION }}/Buddhist-Era-Setup.exe
          PAGE: https://github.com/${{ github.repository }}/releases/tag/windows-v${{ env.APP_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export SIZE=$(stat -c%s /c/rel/Buddhist-Era-Setup.exe)
          SITE=/c/site
          for i in 1 2 3; do
            rm -rf "$SITE"
            git clone -q --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$SITE"
            node /c/bc/.github/scripts/app-version.mjs save windows "$SITE/app-version.json"
            cd "$SITE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-version.json
            git commit -q -m "app-version.json: Windows ${VERSION}" || { echo "no change"; break; }
            if git push -q origin HEAD:main; then echo "app-version.json updated"; break; fi
            cd /c; sleep 5
          done

      - name: Save build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci" /c/bc && cd /c/bc && touch build.log
          tail -c 150000 build.log > "$RUNNER_TEMP/ci/build-tail.log"
          find desktop-app/src-tauri/target/release/bundle -name '*.exe' -exec cp {} "$RUNNER_TEMP/ci/" \; 2>/dev/null || true
          echo '${{ toJSON(steps) }}' > "$RUNNER_TEMP/ci/steps.json"
          echo "run=${{ github.run_number }} version=$APP_VERSION status=$STATUS sha=${{ github.sha }} ref=${{ github.ref_name }}" > "$RUNNER_TEMP/ci/status.txt"
          cd "$RUNNER_TEMP/ci"
          git init -q && git checkout -q -b ci-logs-desktop
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "windows build log run ${{ github.run_number }} ($STATUS)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs-desktop
