# =====================================================================
#  Buddhist Era — offline Android app (Capacitor) build
#  ස්වයංක්‍රීයව ධාවනය නොවේ — අවශ්‍ය විට පමණක්:
#    GitHub → Actions → "Android build" → Run workflow → Run workflow
#  • version code / name හිස්ව තැබුවොත් ස්වයංක්‍රීයව අවසාන අගයට 1ක් එක් කරයි
#    (app-version.json හි සටහන් වේ — උදා: 6 / 1.0.0.6 → 7 / 1.0.0.7). අවශ්‍ය නම් අතින් ද දිය හැක.
#  • ප්‍රතිඵලය: එම run එකේ "Artifacts" යටතේ  buddhist-era-android-…  (APK + AAB)
#    → AAB (app-release.aab) එක Play Console → Production / Testing → Create new release වෙත upload කරන්න.
#  • Repo Settings → Secrets and variables → Actions හි පහත 4 ඇත්නම් Play Store එකට යැවිය හැකි
#    release (signed) build එකක්; නැත්නම් පරීක්ෂණ සඳහා debug APK එකක් පමණි:
#      ANDROID_KEYSTORE_BASE64   ANDROID_KEYSTORE_PASSWORD   ANDROID_KEY_ALIAS   ANDROID_KEY_PASSWORD
#  • Play Store යාවත්කාලීන දැනුම්දීම: Play හි නව version එකක් ඇත්නම් ඇප් එක විවෘත කරන විට Google Play
#    "Update available" තිරය ස්වයංක්‍රීයව පෙන්වයි (MainActivity.java — Play In-App Updates).
# =====================================================================
name: Android build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code — හිස්ව තබන්න (ස්වයංක්‍රීයව අවසාන අගය + 1)'
        required: false
        default: ''
      version_name:
        description: 'Version name — හිස්ව තබන්න (ස්වයංක්‍රීයව, උදා: 1.0.0.7)'
        required: false
        default: ''

permissions:
  contents: write   # build log එක ci-logs branch එකට, app-version.json main එකට

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install Capacitor
        working-directory: android-app
        run: npm install --no-audit --no-fund 2>&1 | tee -a ../build.log

      - name: Copy web files into the app
        working-directory: android-app
        run: npm run prepare-www 2>&1 | tee -a ../build.log

      - name: Create Android project
        working-directory: android-app
        run: |
          npx cap add android 2>&1 | tee -a ../build.log
          npx cap sync android 2>&1 | tee -a ../build.log

      - name: Signing key
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KS_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            [ -n "$KS_KEY_PASS" ] || echo "KS_KEY_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Signing: release keystore found" | tee -a build.log
          else
            echo "Signing: secrets not set → debug build only" | tee -a build.log
          fi

      # අනුවාදය: අතින් දුන්නේ නැත්නම් app-version.json හි අවසාන අගය + 1
      - name: Version
        env:
          IN_CODE: ${{ inputs.version_code }}
          IN_NAME: ${{ inputs.version_name }}
        run: |
          node .github/scripts/app-version.mjs next android app-version.json | tee -a build.log
          [ -n "$IN_CODE" ] && echo "VERSION_CODE=$IN_CODE" >> "$GITHUB_ENV"
          [ -n "$IN_NAME" ] && echo "VERSION_NAME=$IN_NAME" >> "$GITHUB_ENV"
          true

      - name: Apply app settings (icons, permissions, version, signing)
        working-directory: android-app
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -lt 1 ]; then
            echo "Version code must be a whole number, e.g. 6 (got: '$VERSION_CODE')" | tee -a ../build.log; exit 1
          fi
          npm run patch-android 2>&1 | tee -a ../build.log

      - name: Build
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          if [ -n "$KS_FILE" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee -a ../../build.log
          else
            ./gradlew --no-daemon assembleDebug 2>&1 | tee -a ../../build.log
          fi
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: buddhist-era-android-v${{ env.VERSION_NAME }}-code${{ env.VERSION_CODE }}
          path: |
            android-app/android/app/build/outputs/apk/**/*.apk
            android-app/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      # signed build එකක් නම්: AAB එක GitHub Release එකකට ද (පහසු download link එකක් සඳහා)
      - name: Publish AAB as a GitHub Release
        if: env.KS_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${VERSION_NAME}-code${VERSION_CODE}"
          FILE="buddhist-era-${VERSION_NAME}-code${VERSION_CODE}.aab"
          cp android-app/android/app/build/outputs/bundle/release/app-release.aab "$FILE"
          NOTES="Google Play Console වෙත upload කිරීම සඳහා signed Android App Bundle.

          - versionName: ${VERSION_NAME}
          - versionCode: ${VERSION_CODE}
          - commit: ${GITHUB_SHA}"
          gh release create "$TAG" "$FILE" \
            --title "Buddhist Era AAB ${VERSION_NAME} (code ${VERSION_CODE})" \
            --notes "$NOTES" \
          || gh release upload "$TAG" "$FILE" --clobber
          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'

      # signed build එකක් සාර්ථක වූ පසු: අනුවාද අංකය main හි app-version.json හි සටහන් කරයි (ඊළඟ build එක +1)
      - name: Record version in app-version.json
        if: github.event_name == 'workflow_dispatch' && env.KS_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SITE="$RUNNER_TEMP/site"
          for i in 1 2 3; do
            rm -rf "$SITE"
            git clone -q --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$SITE"
            VERSION="$VERSION_NAME" node .github/scripts/app-version.mjs save android "$SITE/app-version.json"
            cd "$SITE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-version.json
            git commit -q -m "app-version.json: Android ${VERSION_NAME} (version code ${VERSION_CODE})" || { echo "no change"; break; }
            if git push -q origin HEAD:main; then echo "app-version.json updated"; break; fi
            cd - >/dev/null; sleep 5
          done

      # ගැටලු විසඳීම සඳහා: build log එකේ අග කොටස ci-logs branch එකට (මුරපද ඉවත් කර)
      - name: Save build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci" && touch build.log
          for v in "$KS_PASS" "$KS_KEY_PASS" "$KS_B64"; do
            [ -n "$v" ] && V="$v" perl -pi -e 's/\Q$ENV{V}\E/***/g' build.log || true
          done
          tail -c 120000 build.log > "$RUNNER_TEMP/ci/build-tail.log"
          find android-app/android/app/build/outputs/apk -name '*.apk' -exec cp {} "$RUNNER_TEMP/ci/" \; 2>/dev/null || true
          echo "run=${{ github.run_number }} version=${VERSION_NAME}(${VERSION_CODE}) status=$STATUS sha=${{ github.sha }} ref=${{ github.ref_name }}" > "$RUNNER_TEMP/ci/status.txt"
          cd "$RUNNER_TEMP/ci"
          git init -q && git checkout -q -b ci-logs
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "build log run ${{ github.run_number }} ($STATUS)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
