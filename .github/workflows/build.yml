name: Build Desktop Executable App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-desktop:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Webview Wrapper Executable
        run: |
          mkdir build_output
          xcopy . build_output /E /I /Y
          powershell Compress-Archive -Path build_output\* -DestinationPath BuddhistEra_Desktop.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          name: "Buddhist Era Desktop App v1.0.0"
          body: "Desktop application bundle generated automatically."
          files: BuddhistEra_Desktop.zip
          draft: false
          prerelease: false
