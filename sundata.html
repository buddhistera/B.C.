<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Times Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f0f2f5; }
         .container { 
        max-width: 500px; 
        margin: 40px auto; 
        background: white; 
        padding: 35px 25px 25px 25px;
        border-radius: 20px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        position: relative; 
    }
        .header { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 10px; }
        select, input { padding: 12px; border-radius: 10px; border: 1px solid #ddd; flex: 1; font-size: 14px; }
        .badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .badge { background: #e3f2fd; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #bbdefb; transition: transform 0.2s; }
        .badge:hover { transform: translateY(-5px); }
        .label { font-size: 0.85em; color: #455a64; display: block; margin-bottom: 8px; font-weight: 600; }
        .time { font-size: 1.6em; font-weight: bold; color: #1565c0; }
              .close-btn {
        position: absolute;
        top: -50px;    
        right: 0px;    
        width: 40px;
        height: 40px;
        background-color: #ff4d4d;
        color: white;
        border: none;
        border-radius: 50%;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(255, 77, 77, 0.4);
    }

    .close-btn:hover { background-color: #ff1a1a; transform: scale(1.1); }
    </style>
</head>

};

    const today = new Date();
    const formattedDate = today.toISOString().split('T')[0];
    document.getElementById('dateInput').value = formattedDate;

    function updateTimes() {
        const dateVal = document.getElementById('dateInput').value; 
        if (!dateVal) return;
        
        const monthDay = dateVal.substring(5); // MM-DD ලබා ගනී
        const offset = parseInt(document.getElementById('districtSelect').value);
        
        const dayData = sunData[monthDay];

        if (dayData) {
            const adjust = (timeStr) => {
                if(!timeStr) return "--:--";
                let [h, m] = timeStr.split(':').map(Number);
                let date = new Date(2026, 0, 1, h, m + offset);
                return date.getHours().toString().padStart(2, '0') + ':' + 
                       date.getMinutes().toString().padStart(2, '0');
            };

            document.getElementById('dawn').innerText = adjust(dayData.dawn);
            document.getElementById('sunrise').innerText = adjust(dayData.sunrise);
            document.getElementById('noon').innerText = adjust(dayData.noon);
            document.getElementById('sunset').innerText = adjust(dayData.sunset);
        } else {
            document.getElementById('dawn').innerText = "--:--";
            document.getElementById('sunrise').innerText = "--:--";
            document.getElementById('noon').innerText = "--:--";
            document.getElementById('sunset').innerText = "--:--";
        }
    }

    document.getElementById('dateInput').addEventListener('change', updateTimes);
    document.getElementById('districtSelect').addEventListener('change', updateTimes);

window.onload = function() {
    const savedDistrict = localStorage.getItem('selectedDistrict');
    if (savedDistrict) {
        document.getElementById('districtSelect').value = savedDistrict;
    }
    updateTimes(); 
};

document.getElementById('districtSelect').addEventListener('change', function() {
    localStorage.setItem('selectedDistrict', this.value);
    updateTimes();
});

    updateTimes();
</script>
